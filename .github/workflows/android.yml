name: Build FPS LAN Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Godot and export templates
        run: |
          V=4.4.1
          wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_linux.x86_64.zip
          unzip -q Godot_v$V-stable_linux.x86_64.zip
          sudo mv Godot_v$V-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/$V.stable
          wget -q https://github.com/godotengine/godot/releases/download/$V-stable/Godot_v$V-stable_export_templates.tpz
          unzip -q Godot_v$V-stable_export_templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* ~/.local/share/godot/export_templates/$V.stable/
      - name: Configure Android SDK
        run: |
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.tres
      - name: Create Android debug keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          python - <<'PY'
          import os
          p = "export_presets.cfg"
          lines = open(p).read().splitlines()
          i = lines.index("package/signed=true")
          lines[i+1:i+1] = [
              'keystore/debug="' + os.environ["RUNNER_TEMP"] + '/debug.keystore"',
              'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password="android"',
          ]
          open(p, "w").write("\n".join(lines) + "\n")
          PY
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --editor --quit
          godot --headless --path . --export-debug Android build/FPS-LAN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FPS-LAN-APK
          path: build/FPS-LAN.apk
          if-no-files-found: error
